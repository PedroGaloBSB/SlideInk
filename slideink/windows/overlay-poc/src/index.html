<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlideInk - PDF Viewer</title>
  
  <!-- SlideInk Design System -->
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="components.css">
  
  <style>
    /* Estilos específicos da aplicação */
    body {
      font-family: var(--font-family-base);
      background: var(--color-neutral-50);
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Toolbar customizada para SlideInk */
    .app-toolbar {
      background: var(--toolbar-bg);
      border-bottom: var(--toolbar-border-bottom);
      box-shadow: var(--shadow-toolbar);
    }

    .logo {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-neutral-800);
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      color: var(--color-primary-500);
    }

    /* PDF Container */
    .pdf-wrapper {
      position: relative;
      flex: 1;
      background: var(--pdf-container-bg);
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--spacing-6);
    }

    #pdf-render {
      box-shadow: var(--shadow-lg);
      max-width: 90%;
      max-height: 90%;
    }

    /* Painéis flutuantes */
    .floating-panel {
      position: absolute;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(8px);
      border: 1px solid var(--color-neutral-200);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: var(--spacing-4);
      z-index: var(--z-index-popover);
      max-width: 320px;
    }

    .test-controls {
      top: var(--spacing-16);
      right: var(--spacing-6);
    }

    .info-panel {
      bottom: var(--spacing-16);
      left: var(--spacing-6);
    }

    .panel-title {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-neutral-800);
      margin-bottom: var(--spacing-3);
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
    }

    .panel-text {
      font-size: var(--font-size-sm);
      color: var(--color-neutral-600);
      line-height: var(--line-height-base);
      margin-bottom: var(--spacing-2);
    }

    .panel-text:last-child {
      margin-bottom: 0;
    }

    /* Status Bar */
    .app-status-bar {
      background: var(--status-bar-bg);
      border-top: var(--status-bar-border-top);
      font-size: var(--font-size-sm);
      color: var(--color-neutral-600);
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
    }

    /* Overlay canvas */
    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      transition: opacity var(--transition-base);
    }

    /* Botões de teste */
    .test-btn {
      background: var(--color-primary-50);
      color: var(--color-primary-700);
      border: 1px solid var(--color-primary-200);
    }

    .test-btn:hover {
      background: var(--color-primary-100);
      border-color: var(--color-primary-300);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Toolbar -->
    <div class="toolbar app-toolbar">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 19l7-7 3 3-7 7-3-3z"/>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
          <path d="M2 2l7.586 7.586"/>
          <circle cx="11" cy="11" r="2"/>
        </svg>
        SlideInk
      </div>
      
      <div class="toolbar-divider"></div>
      
      <button id="btn-prev" class="btn btn-secondary btn-sm">
        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
        Anterior
      </button>
      
      <button id="btn-next" class="btn btn-secondary btn-sm">
        Próximo
        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
      
      <div class="toolbar-spacer"></div>
      
      <!-- Page indicator -->
      <div class="page-navigation">
        <span>Página</span>
        <span class="page-current" id="page-num">--</span>
        <span class="page-separator">/</span>
        <span id="page-total">--</span>
      </div>
      
      <div class="toolbar-divider"></div>
      
      <button id="btn-clear" class="btn btn-danger btn-sm">
        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
        Limpar
      </button>
    </div>

    <!-- PDF Container with overlay -->
    <div class="pdf-wrapper">
      <canvas id="pdf-render"></canvas>
      
      <!-- Test Controls Panel -->
      <div class="floating-panel test-controls">
        <div class="panel-title">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
          Testes do Overlay
        </div>
        <button id="btn-draw-line" class="btn test-btn btn-sm" style="width: 100%; margin-bottom: var(--spacing-2);">
          Desenhar Linha
        </button>
        <button id="btn-draw-circle" class="btn test-btn btn-sm" style="width: 100%; margin-bottom: var(--spacing-2);">
          Desenhar Círculo
        </button>
        <button id="btn-draw-text" class="btn test-btn btn-sm" style="width: 100%; margin-bottom: var(--spacing-2);">
          Escrever Texto
        </button>
        <button id="btn-draw-free" class="btn test-btn btn-sm" style="width: 100%;">
          Desenho Livre
        </button>
      </div>

      <!-- Info Panel -->
      <div class="floating-panel info-panel">
        <div class="panel-title">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4M12 8h.01"/>
          </svg>
          Objetivo da POC
        </div>
        <p class="panel-text">
          Provar que é possível criar uma camada transparente sobre o PDF que seja capturada pelo Zoom/Meet/Teams durante o compartilhamento de tela.
        </p>
        <p class="panel-text">
          <strong>Status:</strong> 
          <span id="poc-status" class="badge badge-warning">Em teste</span>
        </p>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar app-status-bar">
      <div class="status-bar-item">
        <div class="status-indicator">
          <span class="status-dot disconnected" id="connection-status"></span>
          <span id="connection-text">Desconectado do Android</span>
        </div>
      </div>
      <div class="status-bar-item">
        <span>Overlay:</span>
        <span class="badge badge-success" id="overlay-status">Ativo</span>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    const scale = 1.5;
    const canvas = document.getElementById('pdf-render');
    const ctx = canvas.getContext('2d');

    // Canvas do overlay (será usado para desenhar anotações)
    let overlayCanvas = null;
    let overlayCtx = null;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    function createOverlayCanvas() {
      overlayCanvas = document.createElement('canvas');
      overlayCanvas.style.position = 'absolute';
      overlayCanvas.style.top = '0';
      overlayCanvas.style.left = '0';
      overlayCanvas.style.pointerEvents = 'none';
      overlayCanvas.className = 'overlay-canvas';
      overlayCanvas.id = 'overlay-canvas';
      
      const container = document.querySelector('.pdf-wrapper');
      container.appendChild(overlayCanvas);
      
      overlayCtx = overlayCanvas.getContext('2d');
      resizeOverlay();
    }

    function resizeOverlay() {
      if (overlayCanvas && canvas) {
        overlayCanvas.width = canvas.width;
        overlayCanvas.height = canvas.height;
        overlayCanvas.style.top = canvas.offsetTop + 'px';
        overlayCanvas.style.left = canvas.offsetLeft + 'px';
      }
    }

    function renderPage(num) {
      pageRendering = true;
      
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({scale: scale});
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        
        const renderTask = page.render(renderContext);

        renderTask.promise.then(function() {
          pageRendering = false;
          
          document.getElementById('page-num').textContent = num;
          document.getElementById('page-total').textContent = pdfDoc.numPages;
          
          resizeOverlay();
          
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function onPrevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    }

    function onNextPage() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    }

    // Carregar PDF de exemplo
    async function loadPDF() {
      try {
        // PDF de exemplo (usando um URL público para testes)
        const url = 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-plastic-09.pdf';
        
        const loadingTask = pdfjsLib.getDocument(url);
        pdfDoc = await loadingTask.promise;
        
        document.getElementById('page-total').textContent = pdfDoc.numPages;
        renderPage(pageNum);
        
        console.log('PDF carregado com sucesso:', pdfDoc.numPages, 'páginas');
      } catch (error) {
        console.error('Erro ao carregar PDF:', error);
        document.getElementById('poc-status').textContent = 'Erro ao carregar PDF';
        document.getElementById('poc-status').className = 'badge badge-error';
      }
    }

    // Funções de desenho no overlay
    function drawLine() {
      if (!overlayCtx) return;
      
      overlayCtx.strokeStyle = '#EA4335';
      overlayCtx.lineWidth = 3;
      overlayCtx.lineCap = 'round';
      overlayCtx.beginPath();
      overlayCtx.moveTo(50, 50);
      overlayCtx.lineTo(200, 200);
      overlayCtx.stroke();
      
      console.log('Linha desenhada no overlay');
    }

    function drawCircle() {
      if (!overlayCtx) return;
      
      overlayCtx.strokeStyle = '#4285F4';
      overlayCtx.lineWidth = 3;
      overlayCtx.lineCap = 'round';
      overlayCtx.beginPath();
      overlayCtx.arc(300, 150, 50, 0, 2 * Math.PI);
      overlayCtx.stroke();
      
      console.log('Círculo desenhado no overlay');
    }

    function drawText() {
      if (!overlayCtx) return;
      
      overlayCtx.fillStyle = '#34A853';
      overlayCtx.font = 'bold 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      overlayCtx.fillText('Teste de Overlay ✓', 100, 300);
      
      console.log('Texto desenhado no overlay');
    }

    function enableFreeDraw() {
      if (!overlayCanvas) return;
      
      overlayCanvas.style.pointerEvents = 'auto';
      
      overlayCanvas.addEventListener('mousedown', startDrawing);
      overlayCanvas.addEventListener('mousemove', draw);
      overlayCanvas.addEventListener('mouseup', stopDrawing);
      overlayCanvas.addEventListener('mouseout', stopDrawing);
      
      console.log('Modo desenho livre ativado');
    }

    function startDrawing(e) {
      isDrawing = true;
      const rect = overlayCanvas.getBoundingClientRect();
      lastX = e.clientX - rect.left;
      lastY = e.clientY - rect.top;
    }

    function draw(e) {
      if (!isDrawing || !overlayCtx) return;
      
      const rect = overlayCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      overlayCtx.strokeStyle = '#3F9FED';
      overlayCtx.lineWidth = 3;
      overlayCtx.lineCap = 'round';
      overlayCtx.beginPath();
      overlayCtx.moveTo(lastX, lastY);
      overlayCtx.lineTo(x, y);
      overlayCtx.stroke();
      
      lastX = x;
      lastY = y;
    }

    function stopDrawing() {
      isDrawing = false;
    }

    function clearAnnotations() {
      if (overlayCtx) {
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        console.log('Anotações limpas');
      }
    }

    // Event listeners
    document.getElementById('btn-prev').addEventListener('click', onPrevPage);
    document.getElementById('btn-next').addEventListener('click', onNextPage);
    document.getElementById('btn-clear').addEventListener('click', clearAnnotations);
    
    document.getElementById('btn-draw-line').addEventListener('click', drawLine);
    document.getElementById('btn-draw-circle').addEventListener('click', drawCircle);
    document.getElementById('btn-draw-text').addEventListener('click', drawText);
    document.getElementById('btn-draw-free').addEventListener('click', enableFreeDraw);

    // Simular conexão após 2 segundos
    setTimeout(() => {
      const statusDot = document.getElementById('connection-status');
      const statusText = document.getElementById('connection-text');
      
      statusDot.classList.remove('disconnected');
      statusDot.classList.add('connected');
      statusText.textContent = 'Conectado ao Android (Simulação)';
    }, 2000);

    // Inicializar
    createOverlayCanvas();
    loadPDF();

    // Listener para comandos IPC (quando integrado com Electron)
    if (window.require) {
      const { ipcRenderer } = require('electron');
      
      ipcRenderer.on('clear-annotations', () => {
        clearAnnotations();
      });
      
      ipcRenderer.on('add-stroke', (event, stroke) => {
        // Implementar recebimento de strokes do Android
        console.log('Stroke recebido do Android:', stroke);
      });
    }
  </script>
</body>
</html>
