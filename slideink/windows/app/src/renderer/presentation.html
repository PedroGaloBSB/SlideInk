<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideInk - Apresentação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }
        
        #pdf-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #pdf-viewer {
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        canvas {
            display: block;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .controls:hover {
            opacity: 1;
        }
        
        .controls button {
            background: #2563EB;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        
        .controls button:hover {
            background: #1D4ED8;
        }
        
        .controls button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .page-info {
            font-size: 16px;
            min-width: 100px;
            text-align: center;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563EB;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="pdf-container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Carregando PDF...</p>
        </div>
        <div id="pdf-viewer"></div>
    </div>
    
    <div class="controls">
        <button id="prev-btn" onclick="previousPage()">◀ Anterior</button>
        <div class="page-info" id="page-info">Página 1 / --</div>
        <button id="next-btn" onclick="nextPage()">Próxima ▶</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configura PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        
        // IPC listeners (Electron)
        const { ipcRenderer } = require('electron');
        
        // Carrega PDF
        ipcRenderer.on('load-pdf', async (event, data) => {
            await loadPDF(data.path);
        });
        
        // Mudança de página
        ipcRenderer.on('page-change', (event, data) => {
            currentPage = data.currentPage;
            renderPage(currentPage);
        });
        
        async function loadPDF(path) {
            try {
                document.getElementById('loading').style.display = 'block';
                
                // Para demonstração, usa PDF de exemplo
                // Em produção, carregaria o arquivo real
                const examplePDF = 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-plastic-0.pdf';
                
                const loadingTask = pdfjsLib.getDocument(examplePDF);
                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;
                
                document.getElementById('page-info').textContent = `Página ${currentPage} / ${totalPages}`;
                document.getElementById('loading').style.display = 'none';
                
                // Informa total de páginas ao main process
                ipcRenderer.send('set-total-pages', totalPages);
                
                renderPage(currentPage);
                
                console.log(`[PDF] Carregado: ${totalPages} páginas`);
            } catch (error) {
                console.error('[PDF] Erro ao carregar:', error);
                document.getElementById('loading').innerHTML = '<p>Erro ao carregar PDF</p>';
            }
        }
        
        async function renderPage(pageNum) {
            if (!pdfDoc) return;
            
            try {
                const page = await pdfDoc.getPage(pageNum);
                const scale = 1.5;
                const viewport = page.getViewport({ scale });
                
                const container = document.getElementById('pdf-viewer');
                container.innerHTML = '';
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                container.appendChild(canvas);
                
                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;
                
                document.getElementById('page-info').textContent = `Página ${pageNum} / ${totalPages}`;
                document.getElementById('prev-btn').disabled = pageNum <= 1;
                document.getElementById('next-btn').disabled = pageNum >= totalPages;
                
            } catch (error) {
                console.error('[PDF] Erro ao renderizar:', error);
            }
        }
        
        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                ipcRenderer.send('navigate-to-page', currentPage);
                renderPage(currentPage);
            }
        }
        
        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                ipcRenderer.send('navigate-to-page', currentPage);
                renderPage(currentPage);
            }
        }
        
        // Teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextPage();
            } else if (e.key === 'ArrowLeft') {
                previousPage();
            }
        });
        
        // Inicializa com página 1
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('prev-btn').disabled = true;
        });
    </script>
</body>
</html>
